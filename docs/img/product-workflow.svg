<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Как устроена оценка</title><desc id="desc">Чат из CRM или JSON и расшифровка звонка поступают в оценку по версии чек-листа. Gemini 3.8 Flash возвращает ответы, объяснения и цитаты. Сервер проверяет их и считает баллы. Результат сохраняется для карточки и аналитики; при апелляции решение принимает проверяющий.</desc>
<defs>
<linearGradient id="world" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1d14"/><stop offset=".55" stop-color="#07110b"/><stop offset="1" stop-color="#050c08"/></linearGradient>
<marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2l7 4-7 4" fill="none" stroke="#16cf55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="620" rx="22" fill="url(#world)"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#f2f6f3">
<text x="56" y="79" font-size="42" font-weight="700" letter-spacing="-1">Как устроена оценка</text>
<g fill="#102419" stroke="#294d35"><rect x="56" y="185" width="225" height="100" rx="12"/><rect x="56" y="337" width="225" height="100" rx="12"/></g>
<text x="79" y="224" font-size="23" font-weight="600">Чат</text><text x="79" y="256" font-size="18" fill="#b9c8bd">CRM или JSON</text>
<text x="79" y="376" font-size="23" font-weight="600">Звонок</text><text x="79" y="408" font-size="18" fill="#b9c8bd">Расшифровка Scribe</text>
<g stroke="#16cf55" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M281 235h26q12 0 12 12v52h27"/><path d="M281 387h26q12 0 12-12v-76h27"/><path d="M788 299h53"/></g>
<rect x="349" y="162" width="439" height="311" rx="16" fill="#f6faf7"/>
<g fill="#22362a"><text x="375" y="204" font-size="25" font-weight="700">Оценка по чек-листу</text><text x="375" y="236" font-size="17" fill="#5e7164">Gemini 3.8 Flash</text>
<path d="M375 258H761" stroke="#d7e3db"/>
<g font-size="19" font-weight="600"><text x="375" y="295">Ответ</text><text x="375" y="346">Объяснение</text><text x="375" y="397">Цитата</text></g>
<g font-size="16" fill="#5e7164"><text x="525" y="295">По шкале критерия</text><text x="525" y="346">Почему выбран ответ</text><text x="525" y="397">Из реплики диалога</text></g>
<path d="M375 419H761" stroke="#d7e3db"/>
<text x="375" y="448" font-size="16" fill="#5e7164">Один запрос для нужных критериев</text></g>
<text x="860" y="202" font-size="23" font-weight="600">Проверка и расчёт</text>
<text x="860" y="238" font-size="18" fill="#b9c8bd">Сервер сверяет цитаты</text><text x="860" y="264" font-size="18" fill="#b9c8bd">и допустимые ответы,</text><text x="860" y="290" font-size="18" fill="#b9c8bd">затем считает баллы.</text>
<path d="M1000 316v28" stroke="#16cf55" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="860" y="379" font-size="23" font-weight="600">Карточка и аналитика</text><text x="860" y="411" font-size="18" fill="#b9c8bd">Сохранённая оценка</text>
<path d="M1000 431v33" stroke="#6a9c79" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#arrow)"/>
<text x="860" y="498" font-size="21" font-weight="600">Решение проверяющего</text><text x="860" y="530" font-size="18" fill="#b9c8bd">По апелляции</text><text x="860" y="559" font-size="18" fill="#b9c8bd">Итог пересчитывается.</text>
<text x="349" y="526" font-size="19" fill="#b9c8bd">Версия чек-листа и исходный ответ</text><text x="349" y="555" font-size="19" fill="#b9c8bd">остаются в истории.</text>
</g></svg>
